plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def generatedResources = layout.projectDirectory.dir('src/generated/resources')
def mainResources = layout.projectDirectory.dir('src/main/resources')

sourceSets.main.resources {
    srcDir generatedResources
    exclude '.cache/**', '**/.gitkeep'
}

def metadataProperties = [
    minecraft_version: minecraft_version,
    neo_version: neo_version,
    loader_version_range: loader_version_range,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties metadataProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
    expand metadataProperties
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', generatedResources.asFile.absolutePath,
                '--existing', mainResources.asFile.absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    ideSyncTask generateModMetadata
}

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
